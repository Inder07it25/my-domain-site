<!DOCTYPE html>
<html lang="en">
<head>

  <title>Page not found — SISdar Apps</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#F5F8FC" />

  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    (function () {
      var path = location.pathname || "";
      if (path.indexOf("/gamesprite") === 0) {
        sessionStorage.setItem("sisdar-spa-redirect", path + location.search + location.hash);
        location.replace("/gamesprite/");
      }
    })();
  </script>
</head>

  <a class="skip-link" href="#main">Skip to content</a>

        <img src="/assets/logo.png" alt="" class="brand-logo" width="48" height="48" />
        <span class="brand-text" aria-hidden="true"><span class="brand-sisdar">sisdar</span><span class="brand-apps">apps</span></span>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">
          <span class="theme-toggle-sun" aria-hidden="true"></span>

      <nav class="site-nav" aria-label="Main">

      <span class="eyebrow">404</span>

      <div class="hero-actions">
        <a class="button button-primary" href="/index.html">Back home</a>
        <a class="button button-secondary" href="/products.html">View products</a>
